name: CI

on:
  push:
    branches: [main, multi-tenant-feature]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services: 
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >- 
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw -B verify
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379