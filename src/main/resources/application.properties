# postgresql connection (supabase)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DATABASE_CONNECTION_KEY}
spring.datasource.driver-class-name=org.postgresql.Driver

# jpa/hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

token.signing.key=${TOKEN_SIGNING_KEY}
token.expiration=${TOKEN_EXPIRATION}
app.security.token-secret=${APP_SECURITY_TOKEN}

# redis (rate limiting)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=1

#JPA batch properties to set
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

#Debug
logging.level.org.hibernate.engine.jdbc.batch=DEBUG
server.error.include-message=always
# spring.devtools.restart.enabled=false

#SMTP
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#App email configuration
app.mail.from-address=${APP_EMAIL_FROM}
app.mail.is-testing=${IS_TESTING:false}

app.frontend-url=${FRONTEND_URL}